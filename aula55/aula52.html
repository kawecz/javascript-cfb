<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 54 - Aprendendo sobre a Coleção MAP em Javascript</title>
    <script defer src="script.js"></script>
    <style>
      * {
        transition: all 1.2s;
        background: #fff;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #div1 {
        display: flex;
        flex-direction: column;
        align-items: center;

        color: #000;
        max-width: 400px;
        border: 1px solid #000;
        border-radius: 2em;
        padding: 10em;
        padding-bottom: 4em;
        box-shadow: 0px 0px 10px rgba(32, 32, 32, 0.404);

        font-size: 15pt;
        text-align: center;
      }
      #div2 {
        color: #000;
        width: 200px;
        border: 1px solid #000;
        border-radius: 2em;
        padding: 2em;
      }

      button {
        margin-top: 2em;
        padding: 1em;
        border-radius: 2em;
        border: 1px solid #000;
        cursor: pointer;
        font-weight: 600;
      }
      #btn1:hover {
        background: rgb(57, 128, 57);
        transform: scale(1.1);
        color: #fff;
      }
     
      #btn2:hover {
        background: rgb(134, 51, 51);
        transform: scale(1.1);
        color: #fff;
      }

       #btn3:hover {
        background: rgb(57, 128, 57);
        transform: scale(1.1);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="div1">
      <div id="div2"></div>
      <button id="btn1">Add</button>
      <button id="btn2">Remove</button>
      <button id="btn3">Send</button>
    </div>
  </body>
</html>
